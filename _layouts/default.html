<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.titulo %}{{ page.titulo }} · {% elsif page.titulo_pt %}{{ page.titulo_pt }} · {% elsif page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  {% seo %}
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>
  {% include nav.html %}
  {% include doodles.html %}
  <main id="conteudo-principal">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
