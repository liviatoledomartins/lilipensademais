{% assign items = site[include.collection] | sort: 'data' | reverse %}
<section class="shelf" aria-label="{{ include.heading }}">
  <div class="shelf-header">
    <h2>{{ include.heading }}</h2>
    <a href="{{ include.see_all_url | relative_url }}" class="see-all">ver todos →</a>
  </div>
  {% if items.size == 0 %}
    <p class="empty-shelf">{{ include.empty_message }}</p>
  {% else %}
    <div class="shelf-wrap">
      <button class="shelf-nav prev" aria-label="Ver itens anteriores" type="button">‹</button>
      <div class="shelf-track" tabindex="0">
        {% for item in items limit: include.limit %}
          {% include card-square.html item=item %}
        {% endfor %}
      </div>
      <button class="shelf-nav next" aria-label="Ver mais itens" type="button">›</button>
    </div>
  {% endif %}
</section>
